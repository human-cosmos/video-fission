[project]
name = "video-fission"
version = "0.1.0"
description = "Standalone Codex-powered conversation hub with persistent history, skills, and tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.123.5",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.26",
    "python-dotenv>=1.1.1",
    "PyYAML>=6.0.2",
    "python-jose[cryptography]>=3.3.0,<4",
    "passlib[bcrypt]>=1.7.4,<2",
    "bcrypt>=4.0.0,<4.1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
shot-detect = [
    "torch>=2.2",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "scenedetect>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/video_fission"]

[tool.hatch.build.targets.wheel.force-include]
"backend/video_fission/understand/weights/transnetv2-pytorch-weights.pth" = "video_fission/understand/weights/transnetv2-pytorch-weights.pth"
"backend/video_fission/understand/weights/README.md" = "video_fission/understand/weights/README.md"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"backend/video_fission/understand/prompts.py" = ["E501"]

