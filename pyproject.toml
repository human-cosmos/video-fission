[project]
name = "video-fission"
version = "0.1.0"
description = "Standalone Codex-powered conversation hub with persistent history, skills, and tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.123.5",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.26",
    "python-dotenv>=1.1.1",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/video_fission"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

